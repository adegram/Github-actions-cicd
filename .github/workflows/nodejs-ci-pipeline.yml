name: Node.js CI
on:
  pull_request:
    paths: ["nodejs-ci/**", ".github/workflows/nodejs-ci.yml"]
  push:
    branches: [main]
    paths: ["nodejs-ci/**", ".github/workflows/nodejs-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nodejs-ci/package-lock.json
      - run: npm ci
        working-directory: nodejs-ci
      - run: npm run check --if-present
        working-directory: nodejs-ci
      - run: npm test
        working-directory: nodejs-ci
      - run: npm audit --omit=dev --audit-level=high
        working-directory: nodejs-ci
